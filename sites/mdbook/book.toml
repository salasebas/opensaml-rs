[book]
title = "saml-rs"
authors = ["saml-rs"]
description = "SAML 2.0 browser SSO, metadata, and Single Logout for Rust."
language = "en"
src = "src"

[output.html]
additional-css = ["theme/custom.css"]
additional-js = ["theme/rustauth.js"]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/salasebas/saml-rs"
site-url = "/"
no-section-label = true

[output.html.playground]
runnable = false
