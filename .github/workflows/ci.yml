name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  feature-check:
    name: Feature check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo check -p saml-rs --no-default-features
      - run: cargo test -p saml-rs --no-default-features --test no_default_features
      - run: cargo test -p saml-rs --doc --no-default-features

  provider-matrix:
    name: Crypto provider (${{ matrix.provider }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: rustcrypto
            features: crypto-rustcrypto,crypto-legacy-algorithms,crypto-post-quantum,crypto-pkcs11
          - provider: aws-lc
            features: crypto-aws-lc
          - provider: fips
            features: crypto-fips
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - name: Install AWS-LC native build dependencies
        if: matrix.provider != 'rustcrypto'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake clang libclang-dev perl pkg-config
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: matrix.provider == 'fips'
        with:
          go-version: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@cfdc41eb4dcb5a6d098e06c87a1e91076b799307 # nextest
      - run: cargo check --workspace --locked --no-default-features --features "${{ matrix.features }}"
      - run: cargo clippy --workspace --locked --all-targets --no-default-features --features "${{ matrix.features }}" -- -D warnings
      - name: Run provider security regressions
        run: >-
          cargo nextest run -p saml-rs --locked
          --no-default-features --features "${{ matrix.features }}"
          --test provider_regression
          --test xsw
          --test metadata_signature
          --test metadata_trust
          --test external_slo_redirect

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.88.0
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@cfdc41eb4dcb5a6d098e06c87a1e91076b799307 # nextest
      - run: cargo nextest run -p saml-rs --locked
      - run: cargo test -p saml-rs --doc --locked

  semver:
    name: Semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          package: saml-rs
          # saml-rs is still pre-1.0; intentional breaking API changes are
          # released as 0.x minor bumps. release-plz decides the actual bump
          # from Conventional Commits.
          release-type: major

  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      # Abort the whole matrix as soon as one package fails.
      fail-fast: true
      matrix:
        package:
          - saml-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@cfdc41eb4dcb5a6d098e06c87a1e91076b799307 # nextest
      - run: cargo nextest run -p ${{ matrix.package }}
      - run: cargo test -p ${{ matrix.package }} --doc
      - run: RUSTDOCFLAGS="-D warnings -D missing_docs" cargo doc -p ${{ matrix.package }} --lib --no-deps
      - run: cargo check -p ${{ matrix.package }} --examples
      - run: cargo run -p ${{ matrix.package }} --example sso
      - run: cargo run -p ${{ matrix.package }} --example slo

  compatibility:
    name: Compatibility ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      # Abort the whole matrix as soon as one package fails.
      fail-fast: true
      matrix:
        package:
          - opensaml
          - samlify
          - rustsaml
          - samlet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@cfdc41eb4dcb5a6d098e06c87a1e91076b799307 # nextest
      - run: cargo nextest run -p ${{ matrix.package }}
      - run: cargo test -p ${{ matrix.package }} --doc
      - run: RUSTDOCFLAGS="-D warnings -D missing_docs" cargo doc -p ${{ matrix.package }} --lib --no-deps
      - run: cargo check -p ${{ matrix.package }} --all-targets --no-default-features
      - run: cargo nextest run -p ${{ matrix.package }} --no-default-features
      - run: cargo test -p ${{ matrix.package }} --doc --no-default-features

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs:
      - fmt
      - clippy
      - feature-check
      - provider-matrix
      - msrv
      - semver
      - test
      - compatibility
    if: always()
    steps:
      - name: Check required jobs
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
